services:
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "3000:3000"
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:latest
    container_name: toxiproxy
    depends_on:
      - backend
    ports:
      - "8474:8474"   # Control API
      - "8666:8666"   # Port proxy menuju backend
